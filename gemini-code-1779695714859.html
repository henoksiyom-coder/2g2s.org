<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2GS Dairy - የ BMI ማስያ</title>
    <!-- የዌብሳይቱን ዲዛይን ለማስተካከል (Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
        body {
            background-color: #f4f6f9;
            padding-top: 50px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        .btn-primary {
            background-color: #27ae60;
            border: none;
        }
        .btn-primary:hover {
            background-color: #219653;
        }
        #resultBox {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-center mb-4" style="color: #2c3e50;">2GS የሰውነት ክብደት ማውጫ (BMI) ማስያ</h3>
                    
                    <div class="form-group mb-3">
                        <label for="txbHeight" class="form-label">ቁመት (በ ሴንቲሜትር - cm):</label>
                        <input id="txbHeight" type="number" class="form-control" placeholder="ምሳሌ፦ 175" />
                    </div>

                    <div class="form-group mb-3">
                        <label for="txbWeight" class="form-label">ክብደት (በ ኪሎግራም - kg):</label>
                        <input id="txbWeight" type="number" class="form-control" placeholder="ምሳሌ፦ 70" />
                    </div>

                    <button class="btn btn-primary w-100" id="ButtonCal">ክብደቴን አስላ</button>

                    <!-- ውጤቱ የሚታይበት ቦታ -->
                    <div id="resultBox"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ስሌቱን የሚሰራው የ JavaScript ኮድ (ከውጭ API አይፈልግም) -->
    <script>
        document.getElementById('ButtonCal').addEventListener('click', function() {
            // የተጻፉትን ቁጥሮች መቀበል
            var height = parseFloat(document.getElementById('txbHeight').val || document.getElementById('txbHeight').value);
            var weight = parseFloat(document.getElementById('txbWeight').val || document.getElementById('txbWeight').value);
            var resultBox = document.getElementById('resultBox');

            // መረጃው በትክክል መገባቱን ማረጋገጥ
            if (!height || !weight || height <= 0 || weight <= 0) {
                resultBox.style.display = 'block';
                resultBox.style.backgroundColor = '#f8d7da';
                resultBox.style.color = '#721c24';
                resultBox.innerText = 'እባክዎ ትክክለኛ ቁመት እና ክብደት ያስገቡ!';
                return;
            }

            // የ BMI ቀመር: ክብደት / (ቁመት በሜትር ስኩዌር)
            var heightInMeters = height / 100;
            var bmi = weight / (heightInMeters * heightInMeters);
            bmi = bmi.toFixed(1); // ከአስርዮሽ በኋላ 1 ቁጥር ብቻ እንዲያሳይ

            // ውጤቱን መወሰን
            var status = "";
            var boxColor = "";
            var textColor = "";

            if (bmi < 18.5) {
                status = "የክብደት ማነስ (Underweight)";
                boxColor = "#fff3cd";
                textColor = "#856404";
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                status = "ትክክለኛ ክብደት (Normal weight) 🎉";
                boxColor = "#d4edda";
                textColor = "#155724";
            } else if (bmi >= 25 && bmi <= 29.9) {
                status = "ከመጠን ያለፈ ክብደት (Overweight)";
                boxColor = "#ffeeba";
                textColor = "#856404";
            } else {
                status = "ውፍረት አለብዎት (Obese)";
                boxColor = "#f8d7da";
                textColor = "#721c24";
            }

            // ውጤቱን በስክሪኑ ላይ ማሳየት
            resultBox.style.display = 'block';
            resultBox.style.backgroundColor = boxColor;
            resultBox.style.color = textColor;
            resultBox.innerHTML = "የእርስዎ BMI ውጤት: " + bmi + "<br>ደረጃ: " + status;
        });
    </script>

</body>
</html>
